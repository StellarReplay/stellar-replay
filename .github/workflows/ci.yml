name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Test Go packages
        run: go test ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath ./cmd/stellar-replay
      - name: CLI smoke test
        shell: bash
        run: |
          test "$(go run ./cmd/stellar-replay version)" = "0.1.0-dev"
          go run ./cmd/stellar-replay help >/dev/null
      - name: Race tests on supported runner
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Verify clean tree
        shell: bash
        run: git diff --exit-code

