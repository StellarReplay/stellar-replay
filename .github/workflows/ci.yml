name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test Go packages when implementation exists
        shell: bash
        run: |
          if find . -name '*.go' -not -path './.git/*' | grep -q .; then
            go test ./...
          else
            echo 'No Go implementation packages yet; foundation verification passed.'
          fi
      - name: Vet Go packages when implementation exists
        shell: bash
        run: |
          if find . -name '*.go' -not -path './.git/*' | grep -q .; then
            go vet ./...
          else
            echo 'No Go implementation packages yet; vet deferred to the implementation phase.'
          fi

